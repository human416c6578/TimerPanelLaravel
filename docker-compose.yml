name: timerpanel

services:
  app:
    build:
      context: .
      target: production
    image: timerpanel:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      RUN_MIGRATIONS: "true"
      # The application's own data (users, sessions, cache, telescope) is
      # sqlite on a named volume. The game database is external and is only
      # ever read through GAME_DB_* below.
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      GAME_DB_HOST: ${GAME_DB_HOST:?set GAME_DB_HOST in .env}
      GAME_DB_PORT: ${GAME_DB_PORT:-3306}
      GAME_DB_DATABASE: ${GAME_DB_DATABASE:-game_db}
      GAME_DB_USERNAME: ${GAME_DB_USERNAME:-game_user}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD:-}
      REPLAY_STORAGE_PATH: /srv/replays
    volumes:
      - app-storage:/app/storage
      - app-database:/app/database
      # Recordings live outside the application; point REPLAY_HOST_PATH at the
      # real directory on the server.
      - ${REPLAY_HOST_PATH:-./docker/replays}:/srv/replays

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  app-storage:
  app-database:
